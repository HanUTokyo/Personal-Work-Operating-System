server:
  port: 8080

spring:
  application:
    name: task-progress-backend
  datasource:
    url: ${TASKAPP_DB_URL:jdbc:sqlite:../data/tasks.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    root: INFO
    com.taskapp.backend: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

taskapp:
  cors:
    allowed-origins: ${TASKAPP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}
